name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check --all
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test

  node:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: node/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Generated bindings are up to date
        run: git diff --exit-code -- index.js index.d.ts

  python:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install maturin
      - run: maturin build --release --out wheels
      - run: pip install --no-index --find-links wheels firecrawl-anydoc
      # From the repo root: run inside python/ and the source anydoc/
      # directory shadows the installed wheel, which holds the compiled
      # module.
      - run: python -m unittest discover -s python/tests -v
        working-directory: ${{ github.workspace }}
