[package]
name = "anydoc"
version = "0.1.0"
edition = "2024"
description = "Convert documents (doc, docx, odt, rtf, epub, spreadsheets, csv) to GitHub-Flavored Markdown"

[dependencies]
anyhow = "1.0.104"
calamine = { git = "https://github.com/firecrawl/calamine", branch = "fc-prod", features = ["dates"] }
cfb = "0.14.0"
csv = "1.4.0"
encoding_rs = "0.8.35"
quick-xml = "0.41.0"
zip = "8.6.0"
