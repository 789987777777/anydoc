[package]
name = "anydoc"
version = "0.2.0"
edition = "2024"
description = "Convert documents (doc, docx, odt, rtf, epub, pdf, presentations, spreadsheets, csv) to GitHub-Flavored Markdown"
license = "MIT"
repository = "https://github.com/firecrawl/anydoc"

[dev-dependencies]
insta = "1"
sha2 = "0.10"

[dependencies]
calamine = { git = "https://github.com/firecrawl/calamine", branch = "fc-prod", features = ["dates"] }
cfb = "0.14.0"
csv = "1.4.0"
flate2 = "1"
encoding_rs = "0.8.35"
log = "0.4"
pdf-inspector = { git = "https://github.com/firecrawl/pdf-inspector", branch = "fix/gid-differences-tounicode" }
quick-xml = "0.41.0"
zip = "8.6.0"
